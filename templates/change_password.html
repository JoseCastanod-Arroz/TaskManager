<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-body">

<main class="auth-card">
  <div class="auth-brand">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-logo">
    <h1>Cambiar contraseña</h1>
  </div>

  {% if error %}
  <p class="auth-error">{{ error }}</p>
  {% endif %}
  {% if success %}
  <p class="auth-success">{{ success }}</p>
  {% endif %}

  <form method="post" class="auth-form">
    <label>Contraseña actual
      <input type="password" name="current" autocomplete="current-password" required autofocus>
    </label>

    <label>Nueva contraseña
      <input type="password" name="new" autocomplete="new-password" required>
    </label>

    <label>Repetir nueva contraseña
      <input type="password" name="confirm" autocomplete="new-password" required>
    </label>

    <button type="submit" class="auth-submit">Guardar cambios</button>
  </form>

  <p class="auth-alt"><a href="{{ url_for('academic.page') }}">← Volver a la app</a></p>
</main>

</body>
</html>
