<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Línea del día</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='line.css') }}">
</head>
<body>

<header>
  <div class="brand">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="" class="brand-logo">
    <h1>Línea del día</h1>
  </div>
  <nav class="module-nav">
    {% for link in nav_links %}
    <a class="nav-link{% if link.href == request.path %} active{% endif %}" href="{{ link.href }}">{{ link.label }}</a>
    {% endfor %}
  </nav>
  <div class="header-actions">
    <a class="nav-link" href="{{ url_for('auth.change_password') }}">Contraseña</a>
    <a class="nav-link logout-link" href="{{ url_for('auth.logout') }}">Salir</a>
  </div>
</header>

<div class="page-layout">
  <div class="main-column">
    <section id="line-timeline"></section>
  </div>
  <aside class="line-picker-sidebar">
    <h2>Añadir tareas</h2>
    <section id="line-picker"></section>
  </aside>
</div>

<script>
  window.APP_CONFIG = {
    apiBase: "/api/line",
  };
</script>
<script src="{{ url_for('static', filename='line.js') }}"></script>
</body>
</html>
